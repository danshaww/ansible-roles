- name: User Management | Create Skel Profile Parent Directories
  when: item.dest | default('') | dirname | length > 0
  ansible.builtin.file:
    path: "/etc/skel/{{ item.dest | dirname }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop: "{{ user_management_skel_profile.files }}"
  loop_control:
    label: "{{ item.dest | default(item.src) }}"

- name: User Management | Copy Skel Profile Files
  ansible.builtin.copy:
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    dest: "/etc/skel/{{ item.dest | default() }}"
    mode: '0644'
    owner: root
    group: root
  loop: "{{ user_management_skel_profile.files }}"
  loop_control:
    label: "{{ item.dest | default(item.src) }}"
