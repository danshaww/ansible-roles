- name: Unix Groups | Create Groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    gid: "{{ item.gid | default(omit)}}"
  with_items: "{{ user_management_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unix Groups | Add Members to groups
  ansible.builtin.user:
    name: "{{ item.1.name }}"
    groups: "{{ item.0.name }}"
    append: true
  become: true
  loop: "{{ user_management_groups | subelements('members', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} | {{ item.1.name | default('') }}"