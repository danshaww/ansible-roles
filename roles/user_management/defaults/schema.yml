enable_user_management: true # TODO: change to user_management_enable_user_management
enable_group_management: true # TODO: change to user_management_enable_group_management
enable_samba_users: true # TODO: change to user_management_enable_samba_users
home_path: /home # TODO: change to user_management_home_path

## Schema below, these will always be replaced
skel_profile: # TODO: change to user_management_skel_profile
  files: []

users: # TODO: change to user_management_users:
  - username: example
    group: # Defaults to username
    password: password
    uid: 1055 # defaults to 4096
    gid: 1055 # Defaults to UID value
    home: # Defaults to /home/{username}
    shell: # Defaults to /bin/bash
    sudoers: # if not defined, sudoers file be deleted or not created
      - ALL=(ALL) ALL
    ssh_private_key:
    ssh_public_key:
    ssh_authorized_keys:
    ssh_manage_keys: false # remove authorized keys not in Ansible config
    home_dir_files:
      - src: ../config/.bashrc
        dest: .bashrc
    state: # set to absent to delete users and remove home directory
    enable_samba: # default false, requires enable_samba_user on server via inventory

user_management_groups:
  - name: example
    gid: 1092
    state: present
    append: true
    members:
      - name: user1
      - name: user2