- name: Bind DNS | Global Config | Copy Bind Config File
  ansible.builtin.template:
    src: "{{ config_path }}/named.conf.j2"
    dest: "/etc/bind/named.conf"
    owner: root
    group: bind
    mode: '0644'
  no_log: true
  notify:
    - Restart Service

- name: Bind DNS | Global Config | Check Configuration
  ansible.builtin.command: named-checkconf
  changed_when: false
