- name: Fetch secrets in parallel
  shell: >
    bw get password "{{ item }}"
  loop: "{{ secrets_list }}"
  async: 60
  poll: 0
  register: async_jobs
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Wait for secret fetch jobs
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 30
  delay: 2
  loop: "{{ async_jobs.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Build secrets dict safely
  set_fact:
    secrets_dict: >-
      {{
        dict(
          job_result.results |
          map(attribute='item') |
          zip(job_result.results | map(attribute='stdout'))
        )
      }}
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Distribute secrets to all hosts
  set_fact:
    secrets: "{{ hostvars['localhost'].secrets_dict }}"
  no_log: true