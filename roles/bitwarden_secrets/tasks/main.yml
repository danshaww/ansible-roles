- name: Fetch secrets in parallel
  shell: >
    bw get password "{{ item }}"
  loop: "{{ secrets_list }}"
  async: 60
  poll: 0
  register: async_jobs
  no_log: true
  run_once: true
  delegate_to: localhost

- name: Wait for secret fetch jobs
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ async_jobs.results }}"
  register: job_results
  until: job_results.finished
  retries: 30
  delay: 2
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Build secrets dict
  set_fact:
    secrets_dict: >-
      {{
        dict(
          secrets_list |
          zip(job_results.results | map(attribute='stdout'))
        )
      }}
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Distribute secrets to all hosts
  set_fact:
    secrets: "{{ hostvars['localhost'].secrets_dict }}"
  no_log: true