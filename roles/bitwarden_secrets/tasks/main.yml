    - name: Fetch secrets in parallel
      shell: >
        bw get password "{{ item }}"
      loop: "{{ secrets_list }}"
      async: 60
      poll: 0
      register: async_jobs
      no_log: true
      run_once: true
    - name: Wait for results
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ async_jobs.results }}"
      register: job_results
      until: job_results.finished
      retries: 30
      delay: 2
      # no_log: true
      run_once: true
    - name: Build secrets dict
      set_fact:
        secrets: >-
          {{ dict(secrets_list | zip(job_results.results | map(attribute='stdout'))) }}
      # no_log: true