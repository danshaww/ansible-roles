- name: Validate secret grouping
  ansible.builtin.assert:
    that:
      - bws_secret_grouping in ['project', 'none']
    fail_msg: "bws_secret_grouping must be either 'project' or 'none'."

- name: Get all Bitwarden projects
  command:
    argv:
      - "{{ bws_cli_path }}"
      - "project"
      - "list"
      - "--output"
      - "json"
  register: bws_projects_raw
  changed_when: false
  no_log: false
- name: Build project map
  set_fact:
    bws_projects: >-
      {{
        dict(
          (bws_projects_raw.stdout | from_json)
          | map(attribute='name')
          | map('regex_replace', '[^a-zA-Z0-9_]', '_')
          | zip(
              (bws_projects_raw.stdout | from_json)
              | map(attribute='id')
            )
        )
      }}
  no_log: false
- name: Initialize secrets dict
  set_fact:
    secrets: {}
  no_log: false
- name: Fetch secrets for each project
  command:
    argv:
      - "{{ bws_cli_path }}"
      - "secret"
      - "list"
      - "{{ item.value }}"
      - "--output"
      - "json"
  register: bws_results
  loop: "{{ bws_projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  no_log: false
  retries: 5
  delay: 5
- name: Build secrets dict
  set_fact:
    secrets: >-
      {{
        secrets | combine(
          {item.item.key: bws_project_secrets}
          if bws_secret_grouping == 'project'
          else bws_project_secrets
        )
      }}
  vars:
    bws_project_secrets: >-
      {{
        dict(
          (item.stdout | from_json)
          | map(attribute='key')
          | map('regex_replace', '[^a-zA-Z0-9_]', '_')
          | zip(
              (item.stdout | from_json)
              | map(attribute='value')
            )
        )
      }}
  loop: "{{ bws_results.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: false
