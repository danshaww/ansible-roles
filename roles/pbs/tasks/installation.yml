- name: PBS | Installation | Install Packages
  ansible.builtin.apt:
    name: "{{ pbs_packages }}"
    state: present
    update_cache: true
  become: true

- name: PBS | Installation | Enable Services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - proxmox-backup
    - proxmox-backup-proxy
  become: true
