docker_install: # Install Docker?
docker_configure: # Configure Docker? (Deploy compose projects and daemon config)
docker_config_path: # Path to config.json configuration for root user
docker_enable_auth: # Configure github & gitea authentication
docker_build: # Default value for docker build argument when running compose up -d
docker_pull: # Default value for docker pull argument when running compose up -d
docker_enable_syslog: # Enable sending container logs to syslog
docker_compose_projects: # Compose project definition (remove to skip)
  - name: # Compose project name (must match j2 compose project template filename)
    project_path: # Custom project specific path to j2 compose template
    volume_config:
      owner: # Defaults to root
      group: # Defaults to root
      mode: # Defaults to 0770
    create_bind_mount_volume: # Whether to create volume directory or not (default is false)
    volume_data: # Configuration to be deployed into volumes (remove to skip)
      - src: # Source file to place into the volume (relative)
        dest: # Destination on Docker host
        mode: # Permissions inside the volume (defaults to 0644)
        owner: # File/directory owner (defaults to 1000)
        group: # File/directory group (defaults to 1000)
        restart_container: # Container to restart upon changes detected (remove to skip)
        template: # file is jinja template (defaults to false)
docker_compose_default_path: # Path to directory containing compose file templates
docker_base_path: # Use to override /var/lib/docker
docker_bind_mount_volume_path: # Location to create bind mount volume directories