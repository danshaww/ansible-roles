docker_host_install: # Install Docker?
docker_host_configure: # Configure Docker? (Deploy compose projects and daemon config)

docker_host_build: # Default value for docker build argument when running compose up -d
docker_host_pull: # Default value for docker pull argument when running compose up -d

docker_host_base_path: # Use to override /var/lib/docker
docker_host_bind_mount_volume_path: # Use to override /srv/volumes

docker_host_logging:
  type: #syslog, loki or none
  loki_url: #loki connection

docker_host_auth_sources:
  provider:
    auth: # secret containing base64 encoded user:token should be placed here


# Use either playbook project definitions or a project directory; role-defined
# templates can be added to either source.
docker_host_compose_project_dir: # Directory containing Jinja-templated project YAML files; item.key is the filename without its extension

docker_host_compose_projects: # Compose project definitions provided by the playbook
  project1: # Compose project name (must match j2 compose project template filename)
    enabled: # default is true, set to false to remove project without deleting config
    volume_config:
      owner: # Defaults to root
      group: # Defaults to root
      mode: # Defaults to 0770
    create_bind_mount_volume: # Whether to create volume directory or not (default is false)
    networks: # docker compose networks - unset to use defaults (backend + traefik)
    services: # docker compose services
    volumes: # docker compose volumes - unset to not configure named volumes

# Role-defined projects to add (names match files in vars/compose).
docker_host_compose_project_templates:
  - traefik
  - dozzle
