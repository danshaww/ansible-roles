- name: Docker Host | Destroy Projects | Get Active Compose Projects
  ansible.builtin.shell: "docker compose ls -q"
  register: currentapplications
  become: true
  changed_when: false

- name: Docker Host | Destroy Projects | Stop non-required projects
  ansible.builtin.shell: "docker compose -p {{ item }} down"
  loop: "{{ currentapplications.stdout_lines | difference(docker_host_applications) }}"

- name: Docker Host | Destroy Projects | Remove non-required projects
  ansible.builtin.file:
    path: "{{ docker_host_base_path }}/compose/{{ item }}.yml"
    state: absent
  loop: "{{ currentapplications.stdout_lines | difference(docker_host_applications) }}"
