- name: Docker | Configuration | Deploy Projects | Create Directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: docker
    mode: '0750'
    state: directory
  become: true
  with_items:
    - /var/lib/docker/compose
    - /var/lib/docker

- name: Docker | Configuration | Deploy Projects | Create Directories
  ansible.builtin.file:
    path: "/var/lib/docker/compose/{{ item }}"
    owner: root
    group: docker
    mode: '0750'
    state: directory
  become: true
  with_items: "{{ applications }}"

- name: Docker | Configuration | Set ACL for persistent volumes
  ansible.builtin.shell: | # Using shell to skip NFS mounts
    find /var/lib/docker/volumes -xdev -type d ! -type s -print0 | xargs -0 setfacl -d -m g:docker:rx 2>&1 | grep -vE "Operation not supported|No such file or directory" || true
  changed_when: false

- name: Docker | Configuration | Deploy Projects | Generate Compose Files
  ansible.builtin.template:
    src: "{{ item.project_path | default(docker_compose_default_path) }}/{{ item.name }}.yml.j2"
    dest: /var/lib/docker/compose/{{ item.name }}/compose.yml
    owner: root
    group: docker
    mode: '0700'
  with_items: "{{ docker_compose_projects }}"
  become: true
  register: compose

- name: Docker | Configuration | Deploy Projects | Start Compose Projects
  community.docker.docker_compose_v2:
    project_name: "{{ item.name }}"
    project_src: /var/lib/docker/compose/{{ item.name }}
    remove_orphans: true
    build: "{{ docker_build }}"
    pull: "{{ docker_pull }}"
    state: present
  become: true
  with_items: "{{ docker_compose_projects }}"
#  when: item.changed
  loop_control:
    label: "{{ item.name }}"