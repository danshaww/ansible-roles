- name: Docker | Configuration | Deploy Projects | Create Compose Directory
  ansible.builtin.file:
    path: "{{ docker_base_path }}/compose"
    owner: root
    group: root
    mode: '0755'
    state: directory
  become: true

- name: Docker | Configuration | Deploy Projects | Create Volumes
  ansible.builtin.file:
    path: "{{ docker_base_path }}/volumes/{{ item }}"
    owner: root
    group: docker
    mode: '0770'
    state: directory
  become: true
  with_items: "{{ docker_host_applications }}"
  when: docker_volume_type == 'bind_mount'

- name: Docker | Configuration | Deploy Projects | Generate Compose Files
  ansible.builtin.template:
    src: "{{ item.project_path | default(docker_compose_default_path + '/' + item.name + '.yml.j2') }}"
    dest: "{{ docker_base_path }}/compose/{{ item.name }}.yml"
    owner: root
    group: root
    mode: '0600'
  with_items: "{{ docker_compose_projects }}"
  become: true
  loop_control:
    label: "{{ item.name }}"

- name: Docker | Configuration | Deploy Projects | Start Compose Projects
  community.docker.docker_compose_v2:
    project_name: "{{ item.name }}"
    project_src: "{{ docker_base_path }}/compose"
    files: "{{ item.name }}.yml"
    remove_orphans: true
    build: "{{ docker_build }}"
    pull: "{{ docker_pull }}"
    state: present
  become: true
  with_items: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"