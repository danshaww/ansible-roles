- name: Docker | Configuration | Deploy Projects | Get Required Projects
  ansible.builtin.shell: ls "{{ docker_config_path }}/compose" | sed 's/\.[^.]*$//' | sed 's/\.[^.]*$//'
  register: applications
  delegate_to: localhost
  become: true
  changed_when: false

- name: Docker | Configuration | Deploy Projects | Create Directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: docker
    mode: '0750'
    state: directory
  become: true
  with_items:
    - /var/lib/docker/compose
    - /var/lib/docker

- name: Docker | Configuration | Deploy Projects | Create Directories
  ansible.builtin.file:
    path: "/var/lib/docker/compose/{{ item }}"
    owner: root
    group: docker
    mode: '0750'
    state: directory
  become: true
  with_items: "{{ applications.stdout_lines }}"

- name: Docker | Configuration | Set ACL for persistent volumes
  ansible.posix.acl:
    path: /var/lib/docker/volumes
    entity: docker
    etype: group
    permissions: r
    state: present
    recursive: true

- name: Docker | Configuration | Deploy Projects | Generate Compose Files
  ansible.builtin.template:
    src: "{{ docker_config_path }}/compose/{{ item }}.yml.j2"
    dest: /var/lib/docker/compose/{{ item }}/compose.yml
    owner: root
    group: docker
    mode: '0700'
  with_items: "{{ applications.stdout_lines }}"
  become: true
  register: compose

- name: Docker | Configuration | Deploy Projects | Start Compose Projects
  community.docker.docker_compose_v2:
    project_name: "{{ item.item }}"
    project_src: /var/lib/docker/compose/{{ item.item }}
    remove_orphans: true
    build: "{{ docker_build }}"
    pull: "{{ docker_pull }}"
    state: present
  become: true
  with_items: "{{ compose.results }}"
#  when: item.changed
  loop_control:
    label: "{{ item.item }}"