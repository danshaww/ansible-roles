- name: Docker Host | Deploy Config | Ensure root config directory exists
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    mode: '0770'

- name: Docker | Installation | Populate root Docker config from Jinja template
  when: docker_host_config_path is not none
  ansible.builtin.template:
    src: "{{ docker_host_config_path }}"
    dest: /root/.docker/config.json
    mode: '0770'

- name: Docker Host | Deploy Config | Populate daemon.json
  when: docker_host_enable_syslog
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0700'
  notify:
    - Reload Docker
    - Restart Docker