- name: Docker | Installation | APT | Add APT GPG Key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /etc/apt/keyrings/docker.gpg

- name: Docker | Installation | APT |  Add Repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu   jammy stable"
    state: present
    filename: docker

- name: Docker | Installation | APT |  Install Packages
  ansible.builtin.apt:
    pkg: "{{ docker_host_packages }}"

- name: Docker | Installation | Enable and Start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Docker | Installation | Copy ctop binary # need to make this multi arch
  ansible.builtin.copy:
    src: ctop
    dest: /usr/local/bin/ctop
    mode: '0755'
  become: true

- name: Deploy docker ACL restore script
  ansible.builtin.copy:
    dest: /usr/local/sbin/docker-acl-fix.sh
    mode: '0750'
    owner: root
    group: root
    content: |
      #!/bin/sh
      # Re-widens the ACL mask on /var/lib/docker after dockerd
      # resets the directory to 710 on every start, which otherwise
      # caps named user/group ACL entries.
      setfacl -m m::rwx /var/lib/docker

- name: Create docker.service systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy docker.service ExecStartPost override
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/99-acl-fix.conf
    mode: '0644'
    owner: root
    group: root
    content: |
      [Service]
      ExecStartPost=/usr/local/sbin/docker-acl-fix.sh
  notify:
    - Reload Systemd
    - Restart Docker