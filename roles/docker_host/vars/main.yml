docker_host_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker

docker_host_applications: "{{ docker_host_compose_projects | map(attribute='name') | list }}"

docker_host_plugins:
  - name: loki
    alias: grafana/loki-docker-driver:latest