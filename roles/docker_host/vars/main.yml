docker_host_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker

docker_host_applications: "{{ docker_host_compose_projects | map(attribute='name') | list }}"

docker_host_plugins:
  - alias: loki
    name: grafana/loki-docker-driver:latest

docker_host_logging_pipeline_stages: |
  - regex:
      expression: '(?i)\b(?P<level>debug|info|warn(?:ing)?|error|fatal|crit(?:ical)?)\b'
  - labels:
      level: