docker_host_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker

docker_host_applications: "{{ docker_host_compose_projects | dict2items | map(attribute='value.enabled', default=true) | zip(docker_host_compose_projects | dict2items | map(attribute='key')) | rejectattr('0', 'equalto', false) | map(attribute='1') | list }}"

docker_host_plugins:
  - alias: loki
    name: grafana/loki-docker-driver:latest

docker_host_logging_pipeline_stages: !unsafe |
  - regex:
      expression: '(?i)\b(?P<level>trace|debug|info|warn(?:ing)?|error|fatal|crit(?:ical)?)\b'
  - template:
      source: level
      template: '{{ if .Value }}{{ ToLower .Value }}{{ else }}info{{ end }}'
  - labels:
      level:

docker_host_standard_networks:
  networks:
    backend: null
    frontend:
      external: true
      name: traefik_backend