- name: Reload Docker
  ansible.builtin.systemd:
    name: docker
    state: reloaded
  become: true

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true

- name: Reload Systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart all Docker Compose projects
  ansible.builtin.shell: for app in /var/lib/docker/compose/*; do (docker compose -f "$app" down && docker compose -f "$app" up -d); done