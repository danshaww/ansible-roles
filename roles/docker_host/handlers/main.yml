- name: Reload Docker
  ansible.builtin.systemd:
    name: docker
    state: reloaded
  become: true

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true

- name: Reload Systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Recreate Docker Compose projects
  community.docker.docker_compose_v2:
    project_name: "{{ item.name }}"
    project_src: "{{ docker_host_base_path }}/compose"
    files: "{{ item.name }}.yml"
    remove_orphans: true
    build: "{{ docker_host_build }}"
    pull: "{{ docker_host_pull }}"
    state: present
    recreate: always
  loop: "{{ docker_host_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"