- name: Check for NRPE binary
  ansible.builtin.stat:
    path: /usr/local/nagios/bin/nrpe
  register: nrpe_bin
  changed_when: false

- name: Install Build tools (APT)
  ansible.builtin.apt:
    name: "{{ packages.apt }}"
  when: ansible_pkg_mgr == "apt"

- name: Install Build tools (APK)
  community.general.apk:
    name: "{{ packages.apk }}"
  when: ansible_pkg_mgr == "apk"

- name: Install NRPE from source
  when:
    - not nrpe_bin.stat.exists
  block:

    - name: Download NRPE Source
      ansible.builtin.get_url:
        url: "{{ nrpe_install_media }}"
        dest: /tmp

    - name: Unarchive NRPE Source
      ansible.builtin.unarchive:
        src: /tmp/nrpe-4.1.3.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Comile NRPE Source
      ansible.builtin.shell: ./configure --enable-command-args --enable-ssl
      args:
        chdir: "/tmp/nrpe-4.1.3"

    - name: Install NRPE
      ansible.builtin.shell: make "{{ item }}"
      with_items:
        - install-groups-users
        - all
        - install
        - install-plugin
        - install-config
      args:
        chdir: "/tmp/nrpe-4.1.3"

    - name: Add Service (APT)
      ansible.builtin.shell: make "{{ item }}"
      with_items:
        - install-init
      args:
        chdir: "/tmp/nrpe-4.1.3"
      when: ansible_os_family == "Debian"

    - name: Add Service (Alpine)
      ansible.builtin.copy:
        src: nrpe-init-alpine
        dest: /etc/init.d/nrpe
        owner: root
        group: root
        mode: 0755
      when: ansible_os_family == "Alpine"

- name: Configure Service
  ansible.builtin.service:
    name: nrpe
    enabled: true
    state: started

- name: Copy Scripts
  ansible.builtin.copy:
    src: plugins/
    dest: /usr/lib/nagios/plugins/
    owner: root
    group: root
    mode: 0755

# - name: Stop & Disable xinetd
#   ansible.builtin.service:
#     name: xinetd
#     state: stopped
#     enabled: false
#   become: true
#   ignore_errors: true

- name: Add Nagios user to users group
  ansible.builtin.user:
    name: nagios
    groups: users
    append: true
  no_log: true
