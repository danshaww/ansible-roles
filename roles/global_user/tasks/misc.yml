- name: Global_User | Misc | Ensure Directory Exists
  ansible.builtin.file:
    path: "{{ global_user_home_directory }}/git"
    mode: '0755'
    state: directory
    owner: "{{ global_user_username }}"
    group: "{{ global_user_group }}"

- name: Global_User | Misc | Add To Users Group
  ansible.builtin.user:
    name: "{{ global_user_username }}"
    groups: users
    append: true
  no_log: true
