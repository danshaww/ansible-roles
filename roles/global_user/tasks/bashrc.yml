- name: Global_User | Profile Copy
  ansible.builtin.copy:
    src: .profile
    dest: "{{ item.dir }}/.profile"
    mode: '0644'
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  with_items:
    - user: "{{ global_user_username }}"
      dir: "/home/{{ global_user_username }}"
    - user: "root"
      dir: "/root"

- name: Global_User | BASHRC Copy
  ansible.builtin.copy:
    src: .bashrc
    dest: "{{ item.dir }}/.bashrc"
    mode: '0644'
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  with_items:
    - user: "{{ global_user_username }}"
      dir: "/home/{{ global_user_username }}"
    - user: "root"
      dir: "/root"
