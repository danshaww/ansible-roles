- name: Global_User | Profile Copy
  ansible.builtin.copy:
    src: .profile
    dest: "{{ item.dir }}/.profile"
    mode: '0644'
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  with_items:
    - user: "{{ global_user_username }}"
      dir: "{{ global_user_home_directory }}"
    - user: "root"
      dir: "/root"
    - user: "root"
      dir: "/etc/skel"

- name: Global_User | BASHRC Copy
  ansible.builtin.copy:
    src: .bashrc
    dest: "{{ item.dir }}/.bashrc"
    mode: '0644'
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  with_items:
    - user: "{{ global_user_username }}"
      dir: "{{ global_user_home_directory }}"
    - user: "root"
      dir: "/root"
    - user: "root"
      dir: "/etc/skel"
