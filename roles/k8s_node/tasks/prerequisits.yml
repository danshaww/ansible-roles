- name: Gather Package Facts
  ansible.builtin.package_facts:
    manager: auto

- name: Turn off swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Comment out swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\bswap\b.*)$'
    replace: '# \1'

- name: Load modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Persist modules across reboots
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      overlay
    owner: root
    group: root
    mode: '0644'

- name: Sysctl config
  copy:
    dest: /etc/sysctl.d/kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: '0644'
  register: sysctl_config

- name: Enable sysctl config
  when: sysctl_config.changed
  shell: sysctl --system

- name: Configure UFW Firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  with_items: "{{ allowed_ports }}"
  when:
    - "'ufw' in ansible_facts.packages"
