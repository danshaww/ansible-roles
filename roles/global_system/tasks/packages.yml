- name: Add Ansible repository
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
  with_items: "{{ system_repos }}"

- name: Global_System | Packages | Update Cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Global_System | Packages | Installation
  ansible.builtin.apt:
    pkg: "{{ system_packages + global_system_server_packages}}"
