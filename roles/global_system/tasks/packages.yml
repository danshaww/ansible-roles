- name: Global_System | Packages | Update Cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  ignore_errors: true # MPR Downtime Issues

- name: Global_System | Packages | Installation
  ansible.builtin.apt:
    pkg: "{{ system_packages + global_system_server_packages}}"

- name: Global_System | Packages | MPR Config & Installation (Non Ubuntu 24.04 Only)
  when: server_distribution_version != "24.04"
  ignore_errors: true
  block:
    - name: Global_System | Packages | MPR - Add APT GPG Key
      ansible.builtin.apt_key:
        url: https://proget.makedeb.org/debian-feeds/prebuilt-mpr.pub
        keyring: /usr/share/keyrings/prebuilt-mpr-archive-keyring.gpg
    - name: Global_System | Packages | Just - Add MPR APT Repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=all,amd64 signed-by=/usr/share/keyrings/prebuilt-mpr-archive-keyring.gpg] https://proget.makedeb.org prebuilt-mpr bookworm"
        state: present
        filename: prebuilt-mpr

- name: Global_System | Packages | Just Installation
  ansible.builtin.apt:
    pkg: just

- name: Global_System | Packages | CheckMK Agent Installation
  when: global_system_checkmk_install
  block:
    - name: Global_System | Packages | Copy Check MK Installation Media
      ansible.builtin.copy:
        src: check-mk-agent_2.3.0p30-1_all.deb
        dest: /tmp
        mode: '0644'
        owner: root
        group: root
    - name: Global_System | Packages | Install Check MK Agent
      ansible.builtin.apt:
        deb: /tmp/check-mk-agent_2.3.0p30-1_all.deb
        state: present
