- name: Global_System | Packages | Gather Package Facts
  ansible.builtin.package_facts:
    manager: auto

- name: Global_System | Packages | Apt Installation
  ansible.builtin.apt:
    name: "{{ system_packages.apt + (global_system_packages | default([])) }}"
    update_cache: true
  when: ansible_pkg_mgr == "apt"

- name: Global_System | Packages | Apk Repository Configuration
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    line: "{{ item }}"
  when: ansible_pkg_mgr == "apk"
  with_items: "{{ system_packages.apk_repositories }}"

- name: Global_System | Packages | Apk Installation
  community.general.apk:
    name: "{{ system_packages.apk + (global_system_packages | default([])) }}"
    update_cache: true
  when: ansible_pkg_mgr == "apk"