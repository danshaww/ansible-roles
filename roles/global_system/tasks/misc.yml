- name: Global_System | Misc | Set TimeZone
  community.general.timezone:
    name: Europe/London
- name: Global_System | Misc | Allow sudo without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/dan
    line: dan ALL=(ALL) NOPASSWD:ALL
    create: true
    mode: '0644'
- name: Global_System | Misc | Render MOTD Template
  ansible.builtin.template:
    dest: /etc/motd
    src: motd.j2
    mode: '0644'
- name: Global_System | Misc | Render Issue Template
  ansible.builtin.template:
    dest: /etc/issue
    src: issue.j2
    mode: '0644'
- name: Global_System | Misc | Check for just bash completions
  ansible.builtin.stat:
    path: /usr/share/bash-completion/completions/just
  register: completions
- name: Global_System | Misc | Install just bash completions
  ansible.builtin.shell: |
    just --completions bash | sudo tee /usr/share/bash-completion/completions/just >> /dev/null
    echo "complete -F _just -o bashdefault -o default j" | sudo tee -a /usr/share/bash-completion/completions/just >> /dev/null
  become: true
  when: not completions.stat.exists
  changed_when: not completions.stat.exists
- name: Global_System | Misc | Copy Figurine Binary # need to make this multi arch
  ansible.builtin.copy:
    src: figurine
    dest: /usr/local/bin/figurine
    mode: '0755'
- name: Global_System | Misc | Copy Neofetch Binary # need to make this multi arch
  ansible.builtin.copy:
    src: neofetch
    dest: /usr/bin/neofetch
    mode: '0755'
- name: Global_System| Misc | Install Starship
  ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  changed_when: false
  become: true
