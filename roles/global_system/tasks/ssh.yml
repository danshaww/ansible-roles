- name: Global_System | SSH | Copy Config File
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: '0644'
  notify: Restart SSH
- name: Global_System | SSH | Prevent SSH Host Key Deletion
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg.d/deletekeys.cfg
    regexp: 'ssh_deletekeys:'
    line: 'ssh_deletekeys: false'
    mode: 0644
    create: true
    state: present
  when: ansible_facts.virtualization_type == "kvm"
