- name: Global_System | Cloud Init | Copy Config File
  ansible.builtin.copy:
    src: cloud.cfg
    dest: /etc/cloud/cloud.cfg
    mode: 0644
  when: ansible_facts.virtualization_type == "kvm"
  notify: Restart Cloud Init

- name: Global_System | Cloud Init | Prevent SSH Host Key Deletion
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg.d/deletekeys.cfg
    regexp: 'ssh_deletekeys:'
    line: 'ssh_deletekeys: false'
    mode: 0644
    create: true
    state: present
  when: ansible_facts.virtualization_type == "kvm"
  notify: Restart Cloud Init

- name: Global_System | Cloud Init | Remove sudoers File
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
  when: ansible_facts.virtualization_type == "kvm"
