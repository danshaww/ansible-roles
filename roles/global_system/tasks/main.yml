- name: Global_System | Package Installation
  ansible.builtin.include_tasks: packages.yml
  when: enable_packages

- name: Global_System | System SSH Config
  ansible.builtin.include_tasks: ssh.yml
  when: enable_ssh_config

- name: Global_System | Firewall Configuration
  ansible.builtin.include_tasks: firewall.yml
  when: enable_firewall_config

- name: Global_System | Syslog Config
  ansible.builtin.include_tasks: syslog.yml
  when: enable_syslog_config

- name: Global_System | Misc Tasks
  ansible.builtin.include_tasks: misc.yml
  when: enable_misc_config

- name: Global_System | DNS Tasks
  ansible.builtin.include_tasks: dns.yml
  when: enable_dns

- name: Global_System | Cloud Init Tasks
  ansible.builtin.include_tasks: cloud_init.yml
  when: enable_cloud_init