- name: Global_System | Package Installation
  ansible.builtin.include_tasks: packages.yml
  when:
    - global_system_enable_packages | default(true)

- name: Global_System | System SSH Config
  ansible.builtin.include_tasks: ssh.yml
  when:
    - global_system_enable_ssh_config | default(true)

- name: Global_System | Firewall Configuration
  ansible.builtin.include_tasks: firewall.yml
  when:
    - global_system_enable_firewall_config | default(true)

- name: Global_System | Logging Config
  ansible.builtin.include_tasks: logging.yml
  when:
    - global_system_enable_logging_config | default(true)

- name: Global_System | Misc Tasks
  ansible.builtin.include_tasks: misc.yml
  when:
    - global_system_enable_misc_config | default(true)

- name: Global_System | Cloud Init Tasks
  ansible.builtin.include_tasks: cloud_init.yml
  when:
    - global_system_enable_cloud_init | default(true)
    - "'cloud-init' in ansible_facts.packages"
