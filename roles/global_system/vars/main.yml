system_packages:
  - nano
  - htop
  - git
  - net-tools
  - dnsutils
  - rsync
  - tmux
  - rsyslog
  - unzip
  - ca-certificates
  - curl
  - gnupg
  - fio
  - inxi
  - smartmontools
  - acl
  - xclip
  - btop
  - gpg
  - neofetch # EOL
  - cron
  - nfs-common

server_distribution: ansible_facts['distribution'] || default("none")
server_distribution_version: ansible_facts['distribution_version'] || default("none")
server_type: ansible_facts['virtualization_type'] || default("none")
