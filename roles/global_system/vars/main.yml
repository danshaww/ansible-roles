system_packages:
  - sudo
  - nano
  - htop
  - git
  - net-tools
  - rsync
  - tmux
  - rsyslog
  - unzip
  - ca-certificates
  - curl
  - gnupg
  - smartmontools
  - acl
  - gpg
  - just
  - nagios-plugins
  - qemu-guest-agent
  - ncdu
  - dnsutils
  - fio
  - inxi
  - xclip
  - btop
  - cron
  - nfs-common

templates:
  - dest: /etc/motd
    src: "{{ global_system_motd_template_path | default(null) }}"
  - dest: /etc/issue
    src: "{{ global_system_issue_template_path | default(null) }}"

binaries:
  - dest: /usr/local/bin/figurine
    src: figurine
  - dest: /usr/bin/neofetch
    src: neofetch

firewall_ports:
  - port: 22