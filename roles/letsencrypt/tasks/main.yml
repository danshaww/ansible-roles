- name: Lets Encrypt | Install Packages
  become: true
  ansible.builtin.apt:
    pkg: "{{ packages }}"

- name: Lets Encrypt | Check for existing certificate renewal configurations
  become: true
  ansible.builtin.stat:
    path: /etc/letsencrypt/renewal
  register: letsencrypt_renewal_directory

- name: Lets Encrypt | Find existing certificate renewal configurations
  become: true
  ansible.builtin.find:
    paths: /etc/letsencrypt/renewal
    patterns: "*.conf"
    file_type: file
  register: letsencrypt_existing_certificates
  when: letsencrypt_renewal_directory.stat.isdir | default(false)

- name: Lets Encrypt | Remove certificates no longer in the configured list
  become: true
  ansible.builtin.command:
    argv:
      - certbot
      - delete
      - --cert-name
      - "{{ item.path | basename | regex_replace('\\.conf$', '') }}"
      - --non-interactive
  loop: "{{ letsencrypt_existing_certificates.files | default([]) }}"
  when: (item.path | basename | regex_replace('\\.conf$', '')) not in letsencrypt_certificates
  changed_when: true

- name: Lets Encrypt | List remaining certificates
  become: true
  ansible.builtin.command:
    argv:
      - certbot
      - certificates
  register: letsencrypt_certbot_certificates
  changed_when: false

- name: Lets Encrypt | Download ACME DNS Challenge Script
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/alanmburr/acme-dns-certbot/refs/heads/master/acme-dns-auth.py
    dest: /etc/letsencrypt/acme-dns-auth.py
    mode: '0755'
  changed_when: false

- name: Lets Encrypt | Configure Authentication
  ansible.builtin.template:
    src: auth.ini.j2
    dest: /etc/letsencrypt/auth.ini
    mode: '0600'

- name: Lets Encrypt | Check for existing certificates
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  register: certificates
  with_items: "{{ letsencrypt_certificates }}"

- name: Lets Encrypt | Generate Certificate
  ansible.builtin.shell: >
    certbot certonly
    --preferred-challenges dns
    --debug-challenges
    --domain {{ item.item }}
    --non-interactive
    --agree-tos
    --email {{ letsencrypt_email }}
    --dns-cloudflare-credentials /etc/letsencrypt/auth.ini
    --dns-cloudflare
    --dns-cloudflare-propagation-seconds 60
  when: not item.stat.exists
  changed_when: item.stat.exists
  with_items: "{{ certificates.results }}"
  no_log: true

- name: Lets Encrypt | Display certificates
  ansible.builtin.debug:
    var: letsencrypt_certbot_certificates.stdout_lines