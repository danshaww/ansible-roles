- name: Add Cloudflare APT key
  ansible.builtin.apt_key:
    url: "https://pkg.cloudflareclient.com/pubkey.gpg"
    keyring: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
  become: true
- name: Add Cloudflare APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main"
    state: present
  become: true

- name: Install Cloudflare Warp package
  ansible.builtin.apt:
    name: cloudflare-warp
    state: present
    update_cache: true
  become: true

- name: Populate sysctl Config
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.ipv4.ip_forward = 1
  become: true
  register: sysctl_conf

- name: Reload sysctl
  ansible.builtin.shell: sysctl --system
  become: true
  when: sysctl_conf.changed

- name: Check WARP registration status
  ansible.builtin.shell: warp-cli registration show
  register: warp_reg_check
  changed_when: false
  failed_when: false

- name: Register WARP agent
  ansible.builtin.shell: |
    warp-cli --accept-tos connector new {{ cloudflare_warp_tunnel_token }}
    warp-cli connect
  when: "'Unable to load registration' in warp_reg_check.stderr or warp_reg_check.rc != 0"
