storage_server_smartctl_exporter_defaults:
  version: 0.15.0
  listen_address: ":9633"
  interval: 5m
  rescan: 10m
  devices: []
  device_exclude: ""
  allow_from: []
  extra_args: []

_smartctl_exporter: "{{ storage_server_smartctl_exporter_defaults | combine(storage_server_smartctl_exporter | default({}, true)) }}"
_smartctl_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}[ansible_facts.architecture] | default(ansible_facts.architecture) }}"
_smartctl_exporter_release_url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ _smartctl_exporter.version }}"
_smartctl_exporter_archive: "smartctl_exporter-{{ _smartctl_exporter.version }}.linux-{{ _smartctl_exporter_arch }}.tar.gz"
_smartctl_exporter_dir: "/opt/smartctl_exporter/{{ _smartctl_exporter.version }}"
