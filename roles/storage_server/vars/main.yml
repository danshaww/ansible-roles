storage_server_packages:
  - samba
  - nfs-kernel-server
  - zfsutils-linux
  - nfs4-acl-tools
  - sanoid
  - rclone

storage_server_firewall_ports:
  - port: 445
    when: storage_server_smb_config_path is not none
  - port: 111
    when: storage_server_nfs_config_path is not none
  - port: 2049
    when: storage_server_nfs_config_path is not none
