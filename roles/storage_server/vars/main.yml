storage_server_packages:
  - samba
  - nfs-kernel-server
  - zfsutils-linux
  - nfs4-acl-tools
  - sanoid
  - rclone

storage_server_firewall_ports:
  - port: 445
    when: storage_server_smb_config_path is not none
  - port: 111
    when: storage_server_nfs_config_path is not none
  - port: 2049
    when: storage_server_nfs_config_path is not none

storage_server_builtin_cron_jobs:
  - name: Weekly ZFS Scrub
    weekday: '1'
    hour: '09'
    minute: '0'
    job: "/bin/bash zpool scrub data $src $dst 1> >(logger -p local3.info -t $APP_NAME) 2> >(tee /dev/stderr | logger -p local3.err -t $APP_NAME)"