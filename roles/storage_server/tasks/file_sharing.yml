- name: Storage Server | File Sharing | Copy SMB Config
  ansible.builtin.copy:
    src: "{{ storage_server_smb_config_path }}"
    dest: /etc/samba/smb.conf
    owner: root
    group: users
    mode: '0770'
  notify: Restart SMB
  become: true
  when: storage_server_smb_config_path is not none

- name: Storage Server | File Sharing | Copy NFS Config
  ansible.builtin.copy:
    src: "{{ storage_server_nfs_config_path }}"
    dest: /etc/exports
    owner: root
    group: users
    mode: '0770'
  notify: Restart NFS
  become: true
  when: storage_server_nfs_config_path is not none
