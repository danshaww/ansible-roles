- name: Storage Server | Installation
  ansible.builtin.include_tasks: installation.yml
  when: enable_installation

- name: Include Filesystem Tasks
  ansible.builtin.include_tasks: filesystem.yml
  when:
    - storage_server_filesystem is not none
    - enable_filesystem_tasks

- name: Storage Server | Firewall
  ansible.builtin.include_tasks: firewall.yml
  when:
    - enable_firewall_config
    - "'ufw' in ansible_facts.packages"

- name: Storage Server | ZFS
  ansible.builtin.include_tasks: zfs.yml
  when:
    - enable_zfs_config
    - storage_server_zfs is not none

- name: Storage Server | Permissions
  ansible.builtin.include_tasks: permissions.yml
  when:
    - enable_permissions
    - storage_server_permissions is not none

- name: Storage Server | Permissions New
  ansible.builtin.include_tasks: permissions_new.yml
  when:
    - enable_permissions
    # - storage_server_permissions is not none

- name: Storage Server | File Sharing
  ansible.builtin.include_tasks: file_sharing.yml
  when: enable_file_sharing

- name: Storage Server | Rclone
  ansible.builtin.include_tasks: rclone.yml
  when:
    - enable_rclone
    - storage_server_rclone_config_path is not none