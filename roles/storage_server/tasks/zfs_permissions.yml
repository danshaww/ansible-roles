- name: Storage Server | Permissions | Dataset | Set Unix Permissions
  ansible.builtin.file:
    path: "{{ item.path | default(dataset_path) }}"
    mode: "{{ item.mode | default('0770') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  loop: "{{ dataset_permissions }}"
  loop_control:
    label: "{{ item.path | default(dataset_path) }} | {{ item.entity | default('') }}"
  when:
    - item.mode is defined or item.owner is defined or item.group is defined
  become: true

- name: Storage Server | Permissions | Dataset | Remove implicit ACL entries
  ansible.builtin.command:
    cmd: "setfacl -R -x {{ item.etype | first }}:{{ item.entity }} {{ item.path | default(dataset_path) }}"
  loop: "{{ dataset_permissions }}"
  loop_control:
    label: "{{ item.path | default(dataset_path) }} | {{ item.entity | default('') }}"
  when:
    - item.entity is defined
    - item.state | default('present') == 'absent'
  become: true
  changed_when: true

- name: Storage Server | Permissions | Dataset | Remove default ACL entries
  ansible.builtin.command:
    cmd: "setfacl -R -x d:{{ item.etype | first }}:{{ item.entity }} {{ item.path | default(dataset_path) }}"
  loop: "{{ dataset_permissions }}"
  loop_control:
    label: "{{ item.path | default(dataset_path) }} | {{ item.entity | default('') }}"
  when:
    - item.entity is defined
    - item.state | default('present') == 'absent'
  become: true
  changed_when: true

- name: Storage Server | Permissions | Dataset | Configure implicit ACL
  ansible.posix.acl:
    path: "{{ item.path | default(dataset_path) }}"
    entity: "{{ item.entity }}"
    etype: "{{ item.etype | default('group') }}"
    permissions: "{{ item.permissions | default(omit) }}"
    default: false
    state: "{{ item.state | default('present') }}"
    recursive: "{{ item.recursive | default(true) }}"
  loop: "{{ dataset_permissions }}"
  loop_control:
    label: "{{ item.path | default(dataset_path) }} | {{ item.entity | default('') }}"
  when:
    - item.entity is defined
    - item.permissions is defined
  become: true

- name: Storage Server | Permissions | Dataset | Configure default ACL
  ansible.posix.acl:
    path: "{{ item.path | default(dataset_path) }}"
    entity: "{{ item.entity }}"
    etype: "{{ item.etype | default('group') }}"
    permissions: "{{ item.permissions | default(omit) }}"
    default: true
    state: "{{ item.state | default('present') }}"
    recursive: "{{ item.recursive | default(true) }}"
  loop: "{{ dataset_permissions }}"
  loop_control:
    label: "{{ item.path | default(dataset_path) }} | {{ item.entity | default('') }}"
  when:
    - item.entity is defined
    - item.permissions is defined
    - item.default | default(true)
  become: true
