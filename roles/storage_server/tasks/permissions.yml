
- name: Storage Server | ZFS | Set Unix Permissions
  ansible.builtin.file:
    path: "{{ item.extra_zfs_properties.mountpoint | default('/mnt/' + item.name)}}"
    mode: "{{ item.unix_permissions.mode | default('0770') }}"
    owner: "{{ item.unix_permissions.owner | default('root') }}"
    group: "{{ item.unix_permissions.group | default('root') }}"
  loop: "{{ storage_server_zfs.datasets }}"
  when:
    - storage_server_zfs.datasets is defined
    - not (item.unix_permissions.ignore | default(false))
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Storage Server | ZFS | Configure ACL
  ansible.builtin.shell: |
    set -euo pipefail
    MOUNT="{{ item.extra_zfs_properties.mountpoint | default('/mnt/' + item.name) }}"

    normalize() { echo "$1" | sed -e 's/^u:/user:/' -e 's/^g:/group:/'; }

    # Desired type:name keys, derived from ansible config
    DESIRED_KEYS=""
    {% for entry in item.acl %}
    DESIRED_KEYS="$DESIRED_KEYS $(normalize '{{ entry }}' | cut -d: -f1-2)"
    {% endfor %}

    # Current named user/group entries actually on disk (access ACL, top-level representative)
    CURRENT_KEYS=$(getfacl -p --access "$MOUNT" | awk -F: '($1=="user" || $1=="group") && $2!="" {print $1":"$2}')

    for key in $CURRENT_KEYS; do
      case " $DESIRED_KEYS " in
        *" $key "*) : ;;   # still wanted, leave alone
        *)
          echo "Removing stale ACL entry: $key"
          setfacl -R -x "$key" "$MOUNT" || true
          setfacl -R -x "d:$key" "$MOUNT" || true
          ;;
      esac
    done

    # Apply/refresh desired entries — untouched entries stay as-is
    setfacl -R -m "{{ item.acl | join(',') }},d:{{ item.acl | join(',d:') }}" "$MOUNT"
  args:
    executable: /bin/bash
  when:
    - storage_server_zfs.datasets is defined
    - item.acl is defined
    - item.acl != []
  become: true
  loop: "{{ storage_server_zfs.datasets }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Storage Server | ZFS | Stip ACL
  ansible.builtin.shell: |
    setfacl -R -b {{ item.extra_zfs_properties.mountpoint | default('/mnt/' + item.name)}}
  when:
    - storage_server_zfs.datasets is defined
    - item.acl is defined
    - item.acl == []
  become: true
  loop: "{{ storage_server_zfs.datasets }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
