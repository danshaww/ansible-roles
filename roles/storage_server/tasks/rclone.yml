- name: Storage Server | Rclone | Install
  become: true
  ansible.builtin.apt:
    name: rclone

- name: Storage Server | Rclone | Create Directory
  ansible.builtin.file:
    path: "{{ storage_server_rclone.config_dest | default('/root/.config/rclone/rclone.conf') | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Storage Server | Rclone | Generate Config File
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ storage_server_rclone.config_dest | default('/root/.config/rclone/rclone.conf') }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  become: true