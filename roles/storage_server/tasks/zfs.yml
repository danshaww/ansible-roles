- name: Storage Server | ZFS | Create Pools
  community.general.zpool:
    name: "{{ item.name }}"
    vdevs: "{{ item.vdevs }}"
    altroot: "{{ item.altroot | default(omit) }}"
    disable_new_features: "{{ item.disable_new_features | default(false) }}"
    filesystem_properties: "{{ item.filesystem_properties | default({}) }}"
    force: "{{ item.force | default(false) }}"
    mountpoint: "{{ item.mountpoint | default('/mnt/' + item.name) }}"
    pool_properties: "{{ item.pool_properties | default({}) }}"
    state: "{{ item.state | default('present') }}"
    temp_name: "{{ item.temp_name | default(omit) }}"
  with_items: "{{ storage_server_zfs.pools }}"
  when:
    - storage_server_zfs.pools is defined
    - item.vdevs is defined
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Storage Server | ZFS | Create Datasets
  community.general.zfs:
    name: "{{ item.0.name }}/{{ item.1.name }}"
    state: "{{ item.1.state | default('present') }}"
    extra_zfs_properties: "{{ item.1.extra_zfs_properties | default ({}) }}"
  when: item.0.datasets is defined
  loop: "{{ storage_server_zfs.pools | subelements('datasets', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} | {{ item.1.name }}"
  become: true


- name: Storage Server | ZFS | Create Sanoid Config Directory
  ansible.builtin.file:
    path: /etc/sanoid
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: storage_server_zfs.sanoid_config_path is not none

- name: Storage Server | ZFS | Copy Sanoid Config
  ansible.builtin.copy:
    src: "{{ storage_server_zfs.sanoid_config_path }}"
    dest: /etc/sanoid/sanoid.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Sanoid
  become: true
  when: storage_server_zfs.sanoid_config_path is not none

- name: Storage Server | ZFS | Configure zed.rc
  ansible.builtin.template:
    src: zed.rc.j2
    dest: /etc/zfs/zed.d/zed.rc
    owner: root
    group: root
    mode: "0600"
  notify: Restart zed
  become: true
  when: storage_server_zfs.zed is defined

- name: Storage Server | ZFS | Configure Sanoid systemd timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{% if storage_server_zfs.sanoid_enable_timer | default (false) %}true{% else %}false"
    state: "{% if storage_server_zfs.sanoid_enable_timer | default (false) %}started{% else %}stopped"
  loop:
    - sanoid.timer
    - sanoid-prune.timer