- name: Storage Server | ZFS | Create Datasets
  community.general.zfs:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    extra_zfs_properties: "{{ item.extra_zfs_properties | default ({}) }}"
  with_items: "{{ storage_server_zfs.datasets }}"
  when: storage_server_zfs.datasets is defined
  become: true

- name: Storage Server | ZFS | Configure ACL
  ansible.posix.acl:
    path: "/mnt/{{ item.0.name }}"
    entity: "{{ item.1.entity }}"
    etype: "{{ item.1.etype }}"
    permissions: "{{ item.1.permissions | default(omit) }}"
    default: "{{ item.1.default | default(true) }}"
    state: "{{ item.1.state | default('present') }}"
    recursive: "{{ item.1.recursive | default(true) }}"
  loop: "{{ storage_server_zfs.datasets | subelements('acl', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} | {{ item.1.entity }}"
  when: storage_server_zfs.datasets is defined
  become: true

- name: Storage Server | ZFS | Remove all ACL entries (mask included)
  ansible.builtin.command:
    cmd: "setfacl -b {{ '-R' if item.1.recursive | default(true) else '' }} /mnt/{{ item.0.name }}"
  loop: "{{ storage_server_zfs.datasets | subelements('acl', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} | {{ item.1.entity }}"
  when: item.1.state | default('present') == 'absent'
  become: true
  changed_when: true