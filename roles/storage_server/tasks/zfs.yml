- name: Storage Server | ZFS | Create Pools
  community.general.zpool:
    name: "{{ item.key }}"
    vdevs: "{{ item.value.vdevs }}"
    altroot: "{{ item.value.altroot | default(omit) }}"
    disable_new_features: "{{ item.value.disable_new_features | default(false) }}"
    filesystem_properties: "{{ item.value.filesystem_properties | default({}) }}"
    force: "{{ item.value.force | default(false) }}"
    mountpoint: "{{ item.value.mountpoint | default('/mnt/' + item.key) }}"
    pool_properties: "{{ item.value.pool_properties | default({}) }}"
    state: "{{ item.value.state | default('present') }}"
    temp_name: "{{ item.value.temp_name | default(omit) }}"
  when:
    - storage_server_zfs.pools is defined
    - item.value.vdevs is defined
  loop: "{{ storage_server_zfs.pools | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  become: true

- name: Storage Server | ZFS | Create Datasets
  community.general.zfs:
    name: "{{ item.0.key }}/{{ item.1.key }}"
    state: "{{ item.1.value.state | default('present') }}"
    extra_zfs_properties: "{{ item.1.value.extra_zfs_properties | default ({}) }}"
  when: item.0.value.datasets is defined
  loop: "{{ storage_server_zfs.pools | dict2items | subelements('value.datasets', skip_missing=True) | dict2items }}"
  loop_control:
    label: "{{ item.0.key }} | {{ item.1.key }}"
  become: true


- name: Storage Server | ZFS | Create Sanoid Config Directory
  ansible.builtin.file:
    path: /etc/sanoid
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: storage_server_zfs.sanoid_config_path is not none

- name: Storage Server | ZFS | Copy Sanoid Config
  ansible.builtin.copy:
    src: "{{ storage_server_zfs.sanoid_config_path }}"
    dest: /etc/sanoid/sanoid.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Sanoid
  become: true
  when: storage_server_zfs.sanoid_config_path is not none

- name: Storage Server | ZFS | Configure zed.rc
  ansible.builtin.template:
    src: zed.rc.j2
    dest: /etc/zfs/zed.d/zed.rc
    owner: root
    group: root
    mode: "0600"
  notify: Restart zed
  become: true
  when: storage_server_zfs.zed is defined

- name: Storage Server | ZFS | Configure Sanoid systemd timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{% if storage_server_zfs.sanoid_enable_timer | default (false) %}true{% else %}false{% endif %}"
    state: "{% if storage_server_zfs.sanoid_enable_timer | default (false) %}started{% else %}stopped{% endif %}"
  loop:
    - sanoid.timer
    - sanoid.service
    - sanoid-prune.service
  become: true