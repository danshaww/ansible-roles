- name: File Sharing - UFW Configuration
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  with_items:
    - '445'
    - '111'
    - '2049'
  become: true
  when:
    - "'ufw' in ansible_facts.packages"
    - storage_server_nfs_config_path is not none or storage_server_smb_config_path is not none

- name: File Sharing - Copy Samba Configuration file
  ansible.builtin.copy:
    src: "{{ file_sharing.smb_config_path }}"
    dest: /etc/samba/smb.conf
    owner: root
    group: users
    mode: '0770'
  notify: Restart SMB
  become: true
  when: storage_server_smb_config_path is not none

- name: File Sharing - Copy NFS Exports file
  ansible.builtin.copy:
    src: "{{ file_sharing.nfs_config_path }}"
    dest: /etc/exports
    owner: root
    group: users
    mode: '0770'
  notify: Restart NFS
  become: true
  when: storage_server_nfs_config_path is not none
