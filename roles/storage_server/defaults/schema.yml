storage_server_smb_config_path: # Path to smb.conf in local deployment
storage_server_nfs_config_path:  # Path to nfs exports in local deployment
storage_server_sanoid_config_path: # Path to sanoid config file, sanoid install skipped if omitted
storage_server_zfs: # ZFS config, emit for zfs installation to be skipped
  datasets:
    - name: # dataset name
      extra_zfs_properties: # All ZFS options
      state: # set to absent to delete dataset
      acl: # omit for no ACL (inherited only)
        entity: # entity (user/group)
        etype: # entity type
        permissions: # Leave blank for removal
        default: # Create default ACL (default = true)
        state: # set to absent for ACL removal (default = present)



filesystem:
  directories:
    - name: /etc/directory
      mode: '0770' # This option is default
      owner: root # This option is default
      group: users # This option is default
  copy_files:
    - src: ../example_path # Local git path
      dest: ../example_path # Remote destination
      mode: '0770' # This option is default
      owner: root # This option is default
      group: users # This option is default