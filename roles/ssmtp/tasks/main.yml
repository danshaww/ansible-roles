- name: SSMTP | Preseed postfix debconf answers
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: "postfix/main_mailer_type", value: "Internet Site", vtype: "select" }
    - { question: "postfix/mailname", value: "{{ ansible_fqdn }}", vtype: "string" }

- name: SSMTP | Package Installation
  ansible.builtin.apt:
    name: "{{ packages }}"

- name: SSMTP | Populate Config
  ansible.builtin.template:
    dest: /etc/ssmtp/ssmtp.conf
    src: ssmtp.conf.j2
    owner: root
    group: mail
    mode: '0644'

- name: SSMTP | Populate Revaliases
  ansible.builtin.template:
    src: revaliases.j2
    dest: /etc/ssmtp/revaliases
    owner: root
    group: mail
    mode: '0640'