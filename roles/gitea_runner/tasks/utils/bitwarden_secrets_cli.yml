- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present

- name: Download Bitwarden CLI archive
  ansible.builtin.get_url:
    url: "{{ bw_url }}"
    dest: "/tmp/bw.zip"
    mode: '0644'

- name: Unarchive Bitwarden CLI
  ansible.builtin.unarchive:
    src: "/tmp/bw.zip"
    dest: "/tmp/"
    remote_src: yes

- name: Move bw binary to install path
  ansible.builtin.copy:
    src: "/tmp/bw"
    dest: "{{ bw_install_path }}"
    mode: '0755'
    remote_src: yes

- name: Clean up temporary files
  ansible.builtin.file:
    path: "/tmp/bw.zip"
    state: absent