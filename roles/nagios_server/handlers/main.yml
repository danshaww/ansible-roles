- name: Nagios Server | Handlers | Test SMTP
  ansible.builtin.command: "echo -E 'This is a test email' | mail -a 'From: nagios@epichouse.co.uk' -s 'Ansible Test Email' {{ nagios_server_smtp_test_email }}"
  changed_when: false

- name: Nagios Server | Handlers | Restart Nagios
  ansible.builtin.service:
    name: nagios
    state: restarted
