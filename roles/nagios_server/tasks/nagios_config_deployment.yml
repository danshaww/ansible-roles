- name: Copy Files
  ansible.posix.synchronize:
    src: "{{ nagios_config_path }}"
    dest: /usr/local/nagios/etc
    archive: false
    delete: true
    recursive: true
  notify: Restart Nagios

- name: Set Permissions
  ansible.builtin.file:
    path: /usr/local/nagios/etc
    state: directory
    owner: nagios
    group: nagios
    mode: 0755
    recurse: true

- name: Check Nagios Config
  ansible.builtin.command: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
  changed_when: false
  register: config_test

- name: Output config test result
  ansible.builtin.debug:
    msg: "{{ config_test }}"
  changed_when: false

