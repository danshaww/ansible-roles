
- name: Copy Files
  ansible.builtin.copy:
    src: "{{ nagios_config_path }}"
    dest: /usr/local/nagios/etc
    owner: nagios
    group: nagios
    mode: 0755

- name: Nagios | Get Required Objects
  ansible.builtin.shell: ls "{{ nagios_config_path }}/objects" | cat
  register: required_objects
  delegate_to: localhost
  become: true
  changed_when: false

- name: Nagios | Get Current Objects
  ansible.builtin.shell: ls "/usr/local/nagios/etc/objects" | cat
  register: current_objects
  changed_when: false

- name: Nagios | Remove Objects
  ansible.builtin.file:
    path: "{{ nagios_config_path }}/objects/{{ item }}"
    state: absent
  become: true
  with_items: "{{ current_objects.stdout_lines | difference(required_objects.stdout_lines) }}"

- name: Check Nagios Config
  ansible.builtin.command: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
  changed_when: false
  register: config_test

- name: Output config test result
  ansible.builtin.debug:
    msg: "{{ config_test }}"
  changed_when: false

