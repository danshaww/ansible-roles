- name: Nagios Server | Config Deployment | Copy base config
  ansible.builtin.copy:
    src: config/
    dest: /usr/local/nagios/etc/
    owner: nagios
    group: nagios
    mode: '0644'
    directory_mode: '0755'
  notify:
    - Nagios Server | Handlers | Restart Nagios

- name: Nagios Server | Config Deployment | Render main config
  ansible.builtin.template:
    src: nagios.cfg.j2
    dest: /usr/local/nagios/etc/nagios.cfg
    owner: nagios
    group: nagios
    mode: '0644'
  notify:
    - Nagios Server | Handlers | Restart Nagios

# Object definitions come from variables (typically group_vars) matched by
# name prefix, so they can be split across as many files as needed:
#   nagios_server_object_*         dicts of hosts, merged into one dict
#   nagios_server_hostgroups_*     lists, concatenated
#   nagios_server_contacts_*       lists, concatenated
#   nagios_server_contact_groups_* lists, concatenated
#   nagios_server_timeperiods_*    lists, concatenated
- name: Nagios Server | Config Deployment | Merge host objects
  ansible.builtin.set_fact:
    nagios_server_host_objects: >-
      {{
        query(
          'ansible.builtin.vars',
          *(query('ansible.builtin.varnames', '^nagios_server_object_.+') | sort)
        )
        | combine
      }}
    nagios_server_config_objects: {}

- name: Nagios Server | Config Deployment | Merge config objects
  ansible.builtin.set_fact:
    nagios_server_config_objects: >-
      {{
        nagios_server_config_objects
        | combine({
            item: query(
              'ansible.builtin.vars',
              *(query('ansible.builtin.varnames', '^nagios_server_' ~ item ~ '_.+') | sort)
            ) | flatten(levels=1)
          })
      }}
  loop:
    - hostgroups
    - contacts
    - contact_groups
    - timeperiods

- name: Nagios Server | Config Deployment | Create objects directory
  ansible.builtin.file:
    path: /usr/local/nagios/etc/objects
    state: directory
    owner: nagios
    group: nagios
    mode: '0755'

- name: Nagios Server | Config Deployment | Render shared config
  ansible.builtin.template:
    src: config.cfg.j2
    dest: /usr/local/nagios/etc/config.cfg
    owner: nagios
    group: nagios
    mode: '0644'
  notify:
    - Nagios Server | Handlers | Restart Nagios

- name: Nagios Server | Config Deployment | Render host configs
  ansible.builtin.template:
    src: object.cfg.j2
    dest: "/usr/local/nagios/etc/objects/{{ item.key }}.cfg"
    owner: nagios
    group: nagios
    mode: '0644'
  vars:
    nagios_server_hosts: "{{ {item.key: item.value} }}"
  loop: "{{ nagios_server_host_objects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify:
    - Nagios Server | Handlers | Restart Nagios

- name: Nagios Server | Config Deployment | Get required root config files
  ansible.builtin.set_fact:
    nagios_server_required_root_config_files: >-
      {{
        (
          query('ansible.builtin.fileglob', role_path ~ '/files/config/*.cfg')
          | map('basename')
          | list
        ) + ['nagios.cfg', 'config.cfg', 'nrpe.cfg']
      }}

- name: Nagios Server | Config Deployment | Find current root config files
  ansible.builtin.find:
    paths: /usr/local/nagios/etc
    patterns: '*.cfg'
    file_type: file
    recurse: false
  register: nagios_server_current_root_config_files

- name: Nagios Server | Config Deployment | Remove stale root config files
  ansible.builtin.file:
    path: "/usr/local/nagios/etc/{{ item }}"
    state: absent
  loop: >-
    {{
      (
        nagios_server_current_root_config_files.files
        | map(attribute='path')
        | map('basename')
        | list
      )
      | difference(nagios_server_required_root_config_files)
    }}
  notify:
    - Nagios Server | Handlers | Restart Nagios

- name: Nagios Server | Config Deployment | Find current object config files
  ansible.builtin.find:
    paths: /usr/local/nagios/etc/objects
    patterns: '*.cfg'
    file_type: file
    recurse: false
  register: nagios_server_current_object_config_files

- name: Nagios Server | Config Deployment | Remove stale object config files
  ansible.builtin.file:
    path: "/usr/local/nagios/etc/objects/{{ item }}"
    state: absent
  loop: >-
    {{
      (
        nagios_server_current_object_config_files.files
        | map(attribute='path')
        | map('basename')
        | list
      )
      | difference(nagios_server_host_objects.keys() | map('regex_replace', '$', '.cfg') | list)
    }}
  notify:
    - Nagios Server | Handlers | Restart Nagios

- name: Nagios Server | Config Deployment | Check config
  ansible.builtin.command: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
  changed_when: false
  register: nagios_server_config_test

- name: Nagios Server | Config Deployment | Output config test result
  ansible.builtin.debug:
    msg: "{{ nagios_server_config_test }}"
  changed_when: false
